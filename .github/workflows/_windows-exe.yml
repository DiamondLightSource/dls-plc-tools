on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need this so setuptools_scm can derive the version from the last tag
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install runtime deps
        # Installs the project (editable), which triggers setuptools_scm to write
        # _version.py and makes dls_plc_tools importable so the spec can freeze it.
        run: uv sync

      - name: Build single-file exe
        # --with pyinstaller adds it to the run env; a plain `uv run pyinstaller`
        # would first sync the env back to the lockfile (which omits pyinstaller)
        # and uninstall it out from under us.
        run: uv run --with pyinstaller pyinstaller --clean --noconfirm packaging/dls-plc-tools.spec

      - name: Smoke test the frozen exe
        # --version / --help don't import the heavy deps, so this only proves the
        # bootloader + Typer wiring froze. Exercising aphyt / Qt needs a real PLC
        # (see CLAUDE.md); do that on a workstation before trusting a release.
        run: |
          dist/dls-plc-tools.exe --version
          dist/dls-plc-tools.exe --help
          dist/dls-plc-tools.exe read --help

      - name: Upload exe as artifact
        # always() so a failed smoke test still leaves a downloadable exe to
        # inspect; the failed step still fails the job (and blocks the release).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/dls-plc-tools.exe
